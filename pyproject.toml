[project]
name = "prooflag"
version = "0.1.0"
description = "Evidence-backed signals for prediction markets that settle on public documents"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "apscheduler>=3.10,<4",
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "jinja2>=3.1",
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
  "dateparser>=1.2",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "hypothesis>=6.100",
  "respx>=0.21",
  "ruff>=0.5",
  "mypy>=1.10",
  "pre-commit>=3.7",
  "types-beautifulsoup4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prooflag"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]
extend-exclude = ["scripts/classify_slice.py", "scripts/review_dump.py", "scripts/slice_count.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/prooflag"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
