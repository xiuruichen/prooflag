repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.7
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: no-trading-code
        name: forbid order-placement strings in src/
        entry: python scripts/check_no_trading.py
        language: system
        pass_filenames: false
